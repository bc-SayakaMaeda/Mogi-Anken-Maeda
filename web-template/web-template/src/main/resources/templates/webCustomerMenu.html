<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>メニュー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="×××市立図書館のメニュー画面です。">
    <meta name="keywords" content="×××市立図書館, メニュー">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/webCustomerMenu.css}" type="text/css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="webCustomerMenu-container" th:attr="data-total-pages=${totalPages}">
        <div class="header">
            <div class="user-info">
                <span id="user-id" th:text="'利用者ID：' + ${customerID}"></span>
                <span id="user-name" th:text="'利用者名：' + ${customerName}"></span>
            </div>
            <a href="logout.html" id="logoutButton">ログアウト</a>
        </div>
        <hr>
        <div class="title-group">
            <p>貸出希望の本を選択してください</p>
        </div>
        <table id="book-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>タイトル</th>
                    <th>著者</th>
                    <th>在庫数</th>
                    <th>貸出希望</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book, iterStat : ${bookList}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.stockCount}"></td>
                    <td>
                        <input type="checkbox" th:id="'book-' + ${book.bookID}" th:name="'bookIds'" th:value="${book.bookID}">
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="pagination">
            <a href="#" id="prev-page" th:href="@{${prevPageUrl}}" th:if="${hasPrevPage}">＜前</a>
            <span id="page-info" th:text="${currentPage} + ' / ' + ${totalPages}"></span>
            <a href="#" id="next-page" th:href="@{${nextPageUrl}}" th:if="${hasNextPage}">次＞</a>
        </div>
        <div class="form-group">
            <button type="submit" id="webCustomerReservationCheckButton"
                th:onclick="'confirmReservation()'">貸出希望確認</button>
        </div>
    </div>
    <script type="module" th:src="@{/js/webCustomerMenu.js}"></script>
</body>

</html>
