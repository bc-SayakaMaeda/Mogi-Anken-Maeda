<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>貸出予約確定画面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="×××市立図書館の貸出予約確定画面です。">
    <meta name="keywords" content="×××市立図書館, 貸出予約確定">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css"> 
    <link rel="stylesheet" th:href="@{/css/webCustomerReservationCheck.css}" type="text/css"> 
    <link rel="icon" href="data:,">
</head>

    <div class="webCustomerReservationCheck-container">
        <div class="header">
            <div class="user-info">
                <span id="user-id" th:text="'利用者ID：' + ${customerID}"></span>
                <span id="user-name" th:text="'利用者名：' + ${customerName}"></span>
                <a th:href="@{/webCustomerLogin}" id="logoutButton">ログアウト</a>
            </div>
        </div>
        <hr>
        <div class="title-group">
            <p>貸出予約が確定しました。到着までしばらくお待ちください。</p>
        </div>
        <form id="reservationForm" th:action="@{/webCustomerReservationConfirm}" method="post">
            <table id="book-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>タイトル</th>
                        <th>著者</th>
                        <th>在庫数</th>
                        <th>貸出希望</th>
                    </tr>
                </thead>
                <tbody id="book-row-block"></tbody>
            </table>

            <div class="form-group">
                <button type="submit" id="returnMenuButton">メニューに戻る</button>
            </div>
        </form>
    </div>
</html>
